services:
  - type: web
    name: monitor-energi-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: SITE_LOGIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SENSOR_API_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
